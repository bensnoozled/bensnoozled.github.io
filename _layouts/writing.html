---
layout: default
---
<article class="writing-piece">
  <header class="piece-header">
    <h1>{{ page.title }}</h1>
    {% unless page.hide_date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% endunless %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
