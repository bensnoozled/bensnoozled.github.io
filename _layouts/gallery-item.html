---
layout: default
---
<article class="gallery-piece">
  <header class="piece-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  {% if page.image %}
  <figure class="piece-figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.alt | default: page.title }}">
    {% if page.caption %}<figcaption>{{ page.caption }}</figcaption>{% endif %}
  </figure>
  {% endif %}
  {% if content and content != "" %}
  <div class="prose">
    {{ content }}
  </div>
  {% endif %}
</article>
