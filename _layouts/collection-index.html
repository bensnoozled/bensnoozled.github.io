---
layout: default
---
<h1>{{ page.title }}</h1>
{% if content and content != "" %}<div class="prose intro">{{ content }}</div>{% endif %}

{% assign items = site[page.collection] | sort: "date" | reverse %}
<div class="gallery-grid">
  {% for item in items %}
  <a class="gallery-tile" href="{{ item.url | relative_url }}">
    {% if item.image %}
    <img src="{{ item.thumbnail | default: item.image | relative_url }}" alt="{{ item.alt | default: item.title }}" loading="lazy">
    {% endif %}
    <span class="gallery-tile-title">{{ item.title }}</span>
  </a>
  {% endfor %}
</div>
